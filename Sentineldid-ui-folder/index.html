<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SentinelDID UI</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>SentinelDID<sup>TM</sup></h1>
        <h2>"Digital IDentity, Saving Lives"</h2>
    </header>
    <main>
        <p aria-live="polite">Create and verify your DID!</p>
        <div class="form-container">
            <button type="button" onclick="connectLace()" aria-label="Connect to Midnight Lace Wallet">Connect Wallet</button>
            <p id="walletAddress" aria-live="assertive">Wallet: Not connected</p>
            <form id="kycForm" aria-labelledby="formTitle">
                <h3 id="formTitle">Enter Your Information</h3>
                <label for="firstName">First Name: <input id="firstName" placeholder="Johnny" required></label><br>
                <label for="lastName">Last Name: <input id="lastName" placeholder="Appleseed" required></label><br>
                <label for="idNumber">Sentinel-Assigned-ID: <input id="idNumber" placeholder="SDIDxx12345" required></label><br>
                <label for="driversLicense">Driver’s License: <input id="driversLicense" placeholder="DL12345678" required></label><br>
                <label for="dob">Date of Birth: <input type="date" id="dob" required></label><br>
                <label for="ssn">Social Security Number: <input type="password" id="ssn" placeholder="123-45-6789" required></label><br>
                <label for="address">Current Address: <textarea id="address" placeholder="123 Main St, Anytown, USA" required></textarea></label><br>
                <label for="phone">Phone Number: <input type="tel" id="phone" placeholder="555-123-4567" required></label><br>
                <label for="biometric">Biometric Fingerprint (simulate with text): <input type="text" id="biometric" placeholder="Fingerprint data" required></label><br>
                <label for="backgroundCheck">Permission for Background Check: <input type="checkbox" id="backgroundCheck"></label><br>
                <fieldset>
                    <legend>Next of Kin</legend>
                    <label for="nokName">Name: <input id="nokName" placeholder="Jane Doe" required></label><br>
                    <label for="nokRelationship">Relationship: <input id="nokRelationship" placeholder="Spouse" required></label><br>
                    <label for="nokPhone">Phone Number: <input type="tel" id="nokPhone" placeholder="555-987-6543" required></label><br>
                </fieldset>
                <button id="mintButton" type="button" onclick="mintDid()" disabled aria-label="Mint DID (disabled until wallet connected)">Mint DID</button>
            </form>
            <img id="qrCode" alt="Your DID QR Code" style="display:none;">
            <label for="checkDid">Check DID: <input id="checkDid" placeholder="Paste DID"></label><br>
            <button type="button" onclick="checkDid()" aria-label="Verify DID">Verify DID</button>
            <button type="button" onclick="verifyAge()" aria-label="Verify Age">Verify Age</button>
            <p id="result" aria-live="polite"></p>
            <button type="button" onclick="getStats()" aria-label="Get DID Stats">Stats</button>
            <p id="stats" aria-live="polite"></p>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
