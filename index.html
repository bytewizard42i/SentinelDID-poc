    <!-- Form where users type their KYC info -->
    <form id="kycForm">
        <label>First Name: <input id="first-name" placeholder="John/Jane"></label><br>
        <label>Last Name: <input id="last-name" placeholder="Doe"></label><br>
        <label>SentinelDID Number: <input id="SentinelDID-idNumber" placeholder="SDID#-JD12345"></label><br>
        <label
        <!-- Button triggers the JS below -->
        <button type="button" onclick="mintDid()">Make My DID</button>
    </form>
    <!-- Where the QR code pops up -->
    <img id="qrCode" alt="Your DID QR">

    <!-- JavaScript to connect form to server -->
    <script>
        // Function runs when you click the button
        async function mintDid() {
            // Grab what user typed
            const kyc = {
                name: document.getElementById('name').value,
                idNumber: document.getElementById('idNumber').value
            };
            // Send it to our server (localhost:3000) - like mailing a letter
            const response = await fetch('http://localhost:3000/mint-nft', {

                body: JSON.stringify(kyc), // Turn kyc into a string
                headers: { 'Content-Type': 'application/json' } // Say it’s JSON
            });

            const data = await response.json();
            // Show the QR code in the img tag
            document.getElementById('qrCode').src = data.qrUrl;
